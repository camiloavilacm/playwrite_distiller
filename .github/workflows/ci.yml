name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-python-patches: true

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run pytest
        run: pytest tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-python-patches: true

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run pyright
        run: pyright src/playwrite_distiller/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-python-patches: true

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run ruff
        run: ruff check src/

  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-python-patches: true

      - name: Install build dependencies
        run: uv pip install build --system

      - name: Build package
        run: python -m build

      - name: Verify package
        run: |
          uv pip install dist/*.whl --system
          python -c "import playwrite_distiller; print('Package imported successfully')"
