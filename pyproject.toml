[project]
name = "playwrite-distiller"
version = "0.1.0"
description = "Deterministic Playwright-based accessibility distiller and gatekeeper."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.58.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

