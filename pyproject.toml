[project]
name = "playwrite-distiller"
version = "0.1.0"
description = "Deterministic Playwright-based accessibility distiller and gatekeeper."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.58.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.400",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend = "ruff.toml"

